services:
  - type: web
    name: classroom-assignment-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://classroom-assignment-pqcj.vercel.app
      - key: FRONTEND_URL
        value: https://classroom-assignment-pqcj.vercel.app
      - key: CORS_ORIGIN
        value: https://classroom-assignment-pqcj.vercel.app