services:
  - type: web
    name: classroom-assignment-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://gradely.site
      - key: FRONTEND_URL
        value: https://gradely.site
      - key: CORS_ORIGIN
        value: https://gradely.site
      - key: BCRYPT_ROUNDS
        value: 12
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: MAX_FILE_SIZE
        value: 50MB
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 1000
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: ANALYTICS_RETENTION_DAYS
        value: 365
      - key: NOTIFICATION_RETENTION_DAYS
        value: 30
      - key: ENABLE_ANALYTICS
        value: true
      - key: ENABLE_NOTIFICATIONS
        value: true
      - key: ENABLE_FILE_UPLOADS
        value: true
      - key: LOG_LEVEL
        value: info